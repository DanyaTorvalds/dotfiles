# === NVIDIA ФИКС (обязательно!) ===
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# === АВТООПРЕДЕЛЕНИЕ МОНИТОРА ===
monitor=,preferred,auto,1

# === РАСКЛАДКА ===
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# === ОБЩИЕ НАСТРОЙКИ ===
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(333333aa)
    layout = dwindle
}

# === ДЕКОРАЦИИ (BLUR, СКРУГЛЕНИЯ) ===
decoration {
    rounding = 12
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }
    
    active_opacity = 1.0
    inactive_opacity = 0.95
}

# === АНИМАЦИИ ===
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# === ПРОГРАММЫ ===
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

# === АВТОЗАПУСК ===
exec-once = waybar
# exec-once = hyprpaper
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'WhiteSur-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'WhiteSur'
exec-once = mako
exec-once = hypridle
exec-once = swaybg -o HDMI-A-1 -i /home/danya/Pictures/wallpapers/monochrome.jpg --mode fill

# === ХОТКЕИ ===

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, togglefloating

# Перемещение между окнами
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Перемещение окон между воркспейсами
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Переключение воркспейсов
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Мышь
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# === СКРИНШОТЫ ===
# PrintScreen — скриншот всего экрана в файл
bind = , Print, exec, grim $HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Скриншот" "Сохранен в $HOME/Pictures/Screenshots"

# Win + Shift + S — выделение области экрана в файл
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" $HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Скриншот" "Сохранен в $HOME/Pictures/Screenshots"

# Win + Shift + C — выделение области и копирование в буфер (для Discord/Telegram)
bind = $mainMod SHIFT, C, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Скриншот" "Скопирован в буфер обмена"
